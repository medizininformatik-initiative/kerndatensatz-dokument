id: mii-ig-dokument
# Source canonical carried unchanged (never rename a published canonical); the
# template's pattern for NEW modules would be …/fhir/modul-<slug> — this module
# publishes under /fhir/ext/ and stays there.
canonical: https://www.medizininformatik-initiative.de/fhir/ext/modul-dokument
name: MII_IG_Dokument
title: "MII IG Dokument"
description: "Medizininformatik Initiative - KDS-Modul Dokument"
status: draft # ballot release candidate — source value carried
version: 2027.0.0-ballot.rc2
packageId: de.medizininformatikinitiative.kerndatensatz.dokument
fhirVersion: 4.0.1 # https://www.hl7.org/fhir/valueset-FHIR-version.html
copyrightYear: 2026+
releaseLabel: ballot
license: CC-BY-4.0 # owner decision 2026-08-30 (was CC0-1.0; guide already claimed CC BY 4.0)
# Formal IG publication date — owner decision 2026-08-30: meta wiki researched
# (Release-2027, Module-Release-Workflow, version overview) — no actual date
# stated, so the owner's fallback 2026-09-01 applies. go-publish.yml requires
# this to equal the publication_date at Gate D. (Package registry release of
# the RC was 2026-08-28.)
date: "2026-09-01"
jurisdiction: urn:iso:std:iso:3166#DE "Germany" # https://www.hl7.org/fhir/valueset-jurisdiction.html
# IG-level publisher = NUM-DIZ (owner decision 2026-08-30, template default;
# resource-level publisher stays "Medizininformatik Initiative" per the
# template's module-independent ruleset convention — see input/fsh/common/Publisher.fsh).
publisher:
  name: NUM-DIZ
  url: https://www.netzwerk-universitaetsmedizin.de
meta:
  profile:
    - http://hl7.org/fhir/uv/crmi/StructureDefinition/crmi-shareableimplementationguide
    - http://hl7.org/fhir/uv/crmi/StructureDefinition/crmi-publishableimplementationguide
    - http://hl7.org/fhir/uv/crmi/StructureDefinition/crmi-implementationguide
experimental: false
extension:
  # approvalDate aligned to the formal publication date 2026-09-01 (owner
  # fallback, meta wiki states no actual date); replace with the real TF-KDS/NSG
  # approval date if one is minuted later.
  - url: http://hl7.org/fhir/StructureDefinition/resource-approvalDate
    valueDate: "2026-09-01"
  - url: http://hl7.org/fhir/StructureDefinition/cqf-knowledgeCapability
    valueCode: shareable
  - url: http://hl7.org/fhir/StructureDefinition/cqf-knowledgeCapability
    valueCode: publishable
  - url: http://hl7.org/fhir/StructureDefinition/artifact-versionPolicy
    valueCodeableConcept:
      coding:
        - system: http://terminology.hl7.org/CodeSystem/artifact-version-policy-codes
          # version pinned: 'package' exists in CS 3.0.0 (the expansion-manifest pin);
          # the validator otherwise resolves 5.2.0, which lacks it (CI fix 2026-08-30)
          version: "3.0.0"
          code: package
          display: Package
  - url: http://hl7.org/fhir/StructureDefinition/package-source
    extension:
      - url: packageId
        valueId: de.medizininformatikinitiative.kerndatensatz.dokument
      - url: version
        valueString: 2027.0.0-ballot.rc2
      - url: uri
        valueUri: https://www.medizininformatik-initiative.de/fhir/ext/modul-dokument
  - url: http://hl7.org/fhir/StructureDefinition/resource-effectivePeriod
    valuePeriod:
      start: "2027"
  - url: http://hl7.org/fhir/StructureDefinition/artifact-author
    valueContactDetail:
      telecom:
        - system: email
          value: "office@medizininformatik-initiative.de"
  - url: http://hl7.org/fhir/StructureDefinition/artifact-editor
    valueContactDetail:
      name: Taskforce Core Data Set
  - url: http://hl7.org/fhir/StructureDefinition/artifact-reviewer
    valueContactDetail:
      name: Interoperability Working Group
      telecom:
        - system: url
          value: https://www.medizininformatik-initiative.de/en/collaboration/interoperability-working-group
  - url: http://hl7.org/fhir/StructureDefinition/artifact-reviewer
    valueContactDetail:
      name: National Steering Committee
      telecom:
        - system: url
          value: https://www.medizininformatik-initiative.de/en/collaboration/national-steering-committee
  - url: http://hl7.org/fhir/StructureDefinition/artifact-endorser
    valueContactDetail:
      name: Interoperability Working Group
      telecom:
        - system: url
          value: https://www.medizininformatik-initiative.de/en/collaboration/interoperability-working-group
  - url: http://hl7.org/fhir/StructureDefinition/artifact-endorser
    valueContactDetail:
      name: National Steering Committee
      telecom:
        - system: url
          value: https://www.medizininformatik-initiative.de/en/collaboration/national-steering-committee
  - url: http://hl7.org/fhir/StructureDefinition/cqf-expansionParameters
    valueReference:
      reference: Parameters/mii-param-dokument-manifest
  - url: http://hl7.org/fhir/StructureDefinition/artifact-versionAlgorithm
    valueCoding:
      system: http://hl7.org/fhir/version-algorithm
      code: semver
  - url: http://hl7.org/fhir/StructureDefinition/artifact-usage
    valueMarkdown: "Use this ImplementationGuide resource as a computable definition of all the parts of the corresponding module of the Medical Informatics Initiative core data set."
  - url: http://hl7.org/fhir/StructureDefinition/artifact-purpose
    valueMarkdown: "Provide the computable publication unit for the MII Core Dataset Dokument module, enabling implementers to discover, validate, version, and apply the specification consistently."
  # ①-REVIEW: NCI Thesaurus topic code — C19498 "Document" (EVS lookup
