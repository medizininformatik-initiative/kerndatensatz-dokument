  # (meta-wiki Release-2027; inverted from the template default).
  i18n-default-lang: de
  i18n-lang:
    - en
  translation-sources:
    - input/translations/en
  excludexml: false
  excludejson: false
  excludettl: true
  excludemap: false
  logging:
    - init
    - progress
    - context
    - html
    - tx
  pin-canonicals: pin-all
  path-expansion-params: '../../input/resources/Parameters-expansion-manifest.json'
  pin-manifest: 'mii-param-dokument-manifest'
  suppress-mappings:
    - http://hl7.org/v3
    - http://hl7.org/v3/cda
