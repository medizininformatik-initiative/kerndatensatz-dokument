parameters:
  # Canonical URLs defined by this IG that do not start with its canonical: the three
  # build-terminology fragments (see input/resources/README.md).
  special-url:
    - urn:iso:std:iso:3166
    - urn:iso:std:iso:3166:-2
    - http://unstats.un.org/unsd/methods/m49/m49.htm
  path-resource:
    - input/predefined-resources
  path-pages:
    - input/intro-notes # Custom introductory notes
  # EN-FIRST: English is the default language, German the translation
  # (meta-wiki Release-2027; inverted from the template default).
  i18n-default-lang: en
  i18n-lang:
    - de
  translation-sources:
    - input/translations/de
  excludexml: false
  excludejson: false
  excludettl: true
  excludemap: false
  logging:
    - init
    - progress
    - context
    - html
    - tx
  pin-canonicals: pin-all
  path-expansion-params: '../../input/resources/Parameters-expansion-manifest.json'
  pin-manifest: 'mii-param-dokument-manifest'
  suppress-mappings:
    - http://hl7.org/v3
    - http://hl7.org/v3/cda
# NOTE: the template ships `instanceOptions.manualSliceOrdering: true`; it is
# deliberately NOT carried — the source compiled without it, and changing SUSHI
# slice ordering could alter the generated artefacts (byte-identity outranks
# template preference; migration decision, see migration-log/run.log).
