# Page titles are GERMAN (EN-first); the English titles live in the IG-level
# catalogue input/translations/de/ImplementationGuide-mii-ig-dokument.po.
# Metadata for resources that are not authored in FSH (input/resources/*.json).
resources:
  CodeSystem/iso3166-1-fragment:
    name: ISO 3166-1 (Build-Fragment)
    description: Build-Terminologie — ISO-3166-1-Fragment (Deutschland), damit der Publisher die Jurisdiktion auf jedem Terminologieserver auflösen kann.
  CodeSystem/iso3166-2-fragment:
    name: ISO 3166-2 (Build-Fragment)
    description: Build-Terminologie — ISO-3166-2-Fragment, Mitglied des Jurisdiktions-ValueSets.
  CodeSystem/unsd-m49-fragment:
    name: UN M49 (Build-Fragment)
    description: Build-Terminologie — UN-M49-Regionen-Fragment, Mitglied des Jurisdiktions-ValueSets.
  Parameters/mii-param-dokument-manifest:
    name: Expansion-Manifest
    description: Expansions-Parameter des Moduls — pinnt die Editionen der verwendeten Codesysteme (SNOMED CT 20260701) für die ValueSet-Expansionen dieses Leitfadens.

