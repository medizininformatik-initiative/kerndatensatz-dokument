[IG]
; MII KDS module IG build configuration.
;
; [IG] MUST be the very first line of this file: the IG Publisher's
; checkNewIg() rejects an ig.ini unless its content starts with "[IG]"
; (s.startsWith("[IG]")), so any leading comment would make the build fail with
; "unable to find an ig.ini". Keep [IG] on line 1; put all comments below it
; (this mirrors the ig-template-mii-kds preview ig.ini).
;
; ig       = the SUSHI-generated ImplementationGuide resource; its file name
;            derives from `id` in sushi-config.yaml (mii-ig-dokument) - change
;            it there and here together.
; template = the IG template, in one of TWO forms used here (decision
;            2026-08-28, docs/concepts.md section 2):
;
;            1. INTERIM (this file's setting): the template repository's URL
;               (ig-template-mii-kds, currently release v1.3.4). The IG
;               Publisher fetches the repository zip at build time - the
;               DEFAULT branch, i.e. the released state on `main`. No vendored
;               copy to go stale; the trade: the build needs network access and
;               follows `main` instead of a pinned version. This module keeps
;               NO local ig-template/ folder and no sync workflow.
;            2. ENDGAME (later): the registry-published package,
;               `template = de.medizininformatikinitiative.template#<version>`
;               - a pinned id#version resolves through the FHIR package
;               server only, so this waits on the template's publication. The
;               switch is docs/recipes/switch-template-to-published.md.
;
; House rule, enforced by `node scripts/convention-check.mjs`: never a
; floating LABEL - #current / #latest / #dev / #cibuild fail the check. The
; interim URL form is the one sanctioned exception to strict pinning: it
; follows the template's released `main` by design, and the endgame pin
; restores byte-stable rebuilds once the package is published.
ig = fsh-generated/resources/ImplementationGuide-mii-ig-dokument.json
template = https://github.com/medizininformatik-initiative/ig-template-mii-kds

; Those two keys are the whole file. Everything else about the IG — including
; template parameters such as copyrightyear or releaselabel — is configured in
; the ImplementationGuide resource, which SUSHI generates from
; sushi-config.yaml; see its `parameters:` block.
;
; Reference: https://build.fhir.org/ig/FHIR/ig-guidance/
;            https://confluence.hl7.org/display/FHIR/Implementation+Guide+Parameters
